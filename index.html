<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Silkscreen:wght@400;700&family=VT323&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#f3f3f1;--ink:#141414;--grey:#c4c4c4;--teal:#cdfcfc;--pink:#ffadc9;--purple:#c8c0e4;--yellow:#fff200;
  --note-ink:#2a2600;--cell-hover:#a9f0f0;--today:#ff5d8f;--class:#2f6fe4;--event:#e0861a;--bar:#111;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#17171a;--ink:#ececec;--grey:#38383e;--teal:#1d3b3f;--pink:#6a3350;--purple:#4a4470;--yellow:#e9dc3a;
  --note-ink:#2a2600;--cell-hover:#285358;--today:#ff7aa5;--class:#7aa5ff;--event:#ffb347;--bar:#050505}}
:root[data-theme="dark"]{--page:#17171a;--ink:#ececec;--grey:#38383e;--teal:#1d3b3f;--pink:#6a3350;--purple:#4a4470;--yellow:#e9dc3a;--note-ink:#2a2600;--cell-hover:#285358;--today:#ff7aa5;--class:#7aa5ff;--event:#ffb347;--bar:#050505}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;padding:18px}
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);border:3px solid var(--ink);min-height:640px}
.board{background:var(--grey);padding:22px 26px;border-right:3px solid var(--ink);display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.month{font:600 34px/1 Fredoka,"Trebuchet MS",sans-serif;margin:0;letter-spacing:.02em}
.nav{display:flex;gap:6px;margin-top:10px}
.nav button,.add button,.close{font:inherit;background:var(--page);color:var(--ink);border:2px solid var(--ink);padding:4px 10px;cursor:pointer}
.nav button:hover,.add button:hover{background:var(--yellow);color:var(--note-ink)}
.clock{font-size:17px;text-align:left}
.clock b{display:inline-block;min-width:5.5em;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:3px solid var(--ink);background:var(--teal);flex:1}
.dow{padding:5px 8px;font-weight:600;border-bottom:2px solid var(--ink);border-right:2px solid var(--ink);background:var(--teal)}
.dow:nth-child(7){border-right:0}
.day{all:unset;box-sizing:border-box;min-height:84px;padding:5px 6px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;color:var(--ink)}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--cell-hover)}
.day:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--today);outline-offset:-3px}
.day.dim{opacity:.4}
.day.sel{background:var(--purple)}
.day .n{font-weight:600;width:1.7em;height:1.7em;display:grid;place-items:center}
.day.today .n{background:var(--today);color:#fff;border-radius:50%}
.chip{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:4px solid var(--class);padding-left:4px;background:color-mix(in srgb,var(--page) 55%,transparent)}
.chip.Event{border-color:var(--event)}
.more{font-size:11px;opacity:.75}
.legend{font-size:13px;display:flex;gap:14px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;background:var(--class)}
.legend i.e{background:var(--event)}

/* letter box */
.box{background:var(--pink);position:relative;display:flex;flex-direction:column;min-height:640px}
.slot{height:22px;background:var(--bar);margin:36px 8% 0;border:0;position:relative;z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tray{position:absolute;left:0;right:0;top:58px;bottom:0;overflow:hidden;z-index:1}
.hint{position:absolute;inset:40px 12% auto;text-align:center;opacity:.75;font-size:14px}
.hint b{display:block;font:600 20px Fredoka,"Trebuchet MS",sans-serif;margin-bottom:4px}
.letter{width:80%;margin:0 auto;max-height:100%;display:flex;flex-direction:column;transform:translateY(-104%);transition:transform .65s cubic-bezier(.2,.8,.25,1);will-change:transform}
.letter.out{transform:translateY(0)}
.paper{background:var(--purple);border:3px solid var(--ink);border-top:0;padding:16px 14px 14px;position:relative;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;box-shadow:4px 6px 0 rgba(0,0,0,.18)}
.close{position:absolute;right:8px;top:8px;padding:0 7px;line-height:1.4}
.subject{font:600 21px Fredoka,"Trebuchet MS",sans-serif;background:transparent;border:0;border-bottom:2px dashed color-mix(in srgb,var(--ink) 40%,transparent);color:var(--ink);width:calc(100% - 34px);padding:2px 0}
.when{font-size:13px;opacity:.8}
.evs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.evs li,.add{display:flex;gap:4px;align-items:center}
.evs li{border-left:5px solid var(--class);padding-left:5px}
.evs li.Event{border-color:var(--event)}
.paper input:not(.subject),.paper select{font:inherit;font-size:13.5px;background:color-mix(in srgb,var(--page) 70%,transparent);color:var(--ink);border:1.5px solid var(--ink);padding:3px 4px;min-width:0}
.evs input[type=time],.add input[type=time]{width:92px;flex:none}
.evs .t,.add .ti{flex:1}
.del{all:unset;cursor:pointer;padding:0 6px;font-size:18px}
.del:hover{color:var(--today)}
.empty{font-size:13.5px;opacity:.75;margin:2px 0}
.add{margin-top:auto;padding-top:8px;border-top:2px solid var(--ink);flex-wrap:wrap}
.add select{width:74px}
.string{width:3px;height:22px;background:var(--ink);margin:0 auto;flex:none}
.note{flex:none;width:88%;margin:0 auto 24px;background:var(--yellow);border:3px solid var(--ink);box-shadow:3px 5px 0 rgba(0,0,0,.2);transform:rotate(-1.6deg);transform-origin:top center;position:relative}
.note::before{content:"";position:absolute;left:50%;top:-8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--today);border:2px solid var(--ink)}
.note textarea{display:block;width:100%;height:118px;resize:none;border:0;background:transparent;font:700 21px/1.15 Caveat,"Comic Sans MS",cursive;color:var(--note-ink);padding:14px 10px 8px}
.note textarea::placeholder{color:rgba(42,38,0,.55)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .board{border-right:0;border-bottom:3px solid var(--ink);padding:16px}
  .day{min-height:64px}.chip{font-size:10px}
  .box{min-height:700px}
}
@media (max-width:520px){.chip{display:none}.day.has::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--class);margin-left:4px}}
@media (prefers-reduced-motion:reduce){.letter{transition:none}}

/* cute pink pass */
:root{--grey:#f4dce7;--event:#ff4f93;--accent:#ff6fa5;--accent-d:#d63a7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--grey:#3a2b35;--event:#ff8ab8;--accent:#ff7aa5;--accent-d:#ff9cbc}}
:root[data-theme="dark"]{--grey:#3a2b35;--event:#ff8ab8;--accent:#ff7aa5;--accent-d:#ff9cbc}
.app{border-radius:30px;overflow:hidden;box-shadow:0 8px 0 var(--accent)}
.month{color:var(--accent);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;letter-spacing:.05em;font-size:38px}
.clock b{background:var(--accent);color:#fff;padding:1px 10px;border-radius:999px}
.nav button,.add button,.close{border-radius:999px;transition:transform .15s,background .15s}
.nav button:hover,.add button:hover{background:var(--accent);color:#fff;transform:translateY(-2px) scale(1.06)}
.nav button:active,.add button:active{transform:scale(.9)}
.add button{background:var(--accent);color:#fff;padding:4px 16px;font-weight:600}
.cal{border-radius:18px;overflow:hidden}
.cal.flip{animation:flip .4s ease-out}
.day .n{transition:transform .2s}
.day:hover .n{transform:scale(1.2)}
.day.today .n{animation:pulse 2s ease-out infinite}
.day.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.day.sel .n{animation:wob .5s}
.chip{border-left:0;border-radius:999px;padding:1px 8px;background:color-mix(in srgb,var(--class) 22%,var(--teal))}
.chip.Event{background:color-mix(in srgb,var(--event) 30%,var(--teal))}
.box::before,.box::after{content:"♥";position:absolute;color:rgba(255,255,255,.6);font-size:26px;animation:float 6s ease-in-out infinite}
.box::before{left:7%;bottom:7%}
.box::after{content:"✦";right:8%;bottom:20%;font-size:22px;animation-delay:-3s}
.slot{border-radius:14px}
.slot::after{content:"♥ ♥ ♥";color:var(--accent);position:absolute;inset:0;display:grid;place-items:center;font-size:11px;letter-spacing:8px}
.letter{transition:transform .9s cubic-bezier(.3,1.35,.5,1)}
.letter:not(.out){transition-duration:.45s;transition-timing-function:ease-in}
.paper{border-radius:0 0 22px 22px;background-image:radial-gradient(rgba(255,255,255,.4) 1.5px,transparent 1.6px);background-size:14px 14px}
.subject{border-bottom-color:var(--accent)}
.paper input:not(.subject),.paper select{border-radius:10px}
.evs li{flex-wrap:wrap;border-radius:12px;animation:pop .35s both}
.evs input[type=time],.add input[type=time]{flex:1 1 78px;width:auto;font-size:13px}
.evs .t{flex:1 1 100%;order:5}
.add .ti{flex:1 1 100%}
.evs select,.add select{width:66px;flex:none}
.note{border-radius:8px 8px 16px 16px}
.letter.out .note{animation:swing 2.6s ease-in-out .9s infinite alternate}
.note::before{content:"♥";width:auto;height:auto;background:none;border:0;border-radius:0;margin-left:-9px;font-size:24px;line-height:1;top:-15px;color:var(--accent-d)}
.heart{position:fixed;z-index:9;pointer-events:none;color:var(--accent);font-size:18px;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes flip{from{transform:translateY(-10px) scale(.98);opacity:0}}
@keyframes wob{30%{transform:rotate(-14deg) scale(1.25)}60%{transform:rotate(10deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--today) 70%,transparent)}100%{box-shadow:0 0 0 11px transparent}}
@keyframes float{50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes swing{from{transform:rotate(-3deg)}to{transform:rotate(1.5deg)}}
/* categories, cat, reminders */
[hidden]{display:none!important}
.Class{--c:#2f6fe4}.Extra{--c:#1fa88a}.Exam{--c:#e5393d}.Friends{--c:#ff4f93}.Family{--c:#f0961f}
.chip,.chip.Event{background:color-mix(in srgb,var(--c) 26%,var(--teal))}
.evs li{border-left-color:var(--c)}
.legend{flex-wrap:wrap;gap:6px 14px}
.legend i{background:var(--c)}
.slot{margin-top:76px}
.tray{top:98px}
.cat{position:absolute;right:13%;top:2px;width:98px;z-index:4;cursor:pointer;transform-origin:bottom center}
.cat svg{display:block;width:100%;overflow:visible}
.cat .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 1.6s ease-in-out infinite alternate}
.cat .head{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3s ease-in-out infinite}
.cat .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.cat.help{animation:hop .5s}
.cat.help .paws{animation:reach 1.1s ease-in-out}
.say{position:absolute;right:104%;top:8px;white-space:nowrap;background:#fff;color:#141414;border:2px solid #141414;border-radius:14px;padding:2px 10px;font:600 13px Fredoka,sans-serif;opacity:0;transform:scale(.4);transform-origin:right center;transition:.25s}
.cat.help .say{opacity:1;transform:scale(1)}
.rem-fab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);font-size:30px;line-height:1;cursor:pointer;z-index:20;box-shadow:0 5px 0 var(--accent-d);animation:bobfab 3s ease-in-out infinite}
.rem-fab.ring{animation:ringfab 2.6s ease-in-out infinite}
.badge{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--yellow);color:var(--note-ink);border:2px solid var(--ink);font:700 14px/20px system-ui,sans-serif;padding:0 5px}
.rem-panel{position:fixed;left:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 36px));max-height:min(60vh,520px);overflow:auto;background:var(--page);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--accent);z-index:20;padding:12px 14px;transform-origin:bottom left;animation:pop .3s both}
.rem-panel header{display:flex;justify-content:space-between;align-items:center;font:600 19px Fredoka,sans-serif;color:var(--accent-d)}
.rem-panel header button{all:unset;cursor:pointer;font-size:20px;padding:0 6px}
.rem-day h3{margin:10px 0 4px;font:600 15px Fredoka,sans-serif}
.rem-item{display:flex;gap:8px;align-items:center;padding:5px 8px;margin:3px 0;border-radius:12px;cursor:pointer;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--page));font-size:13.5px}
.rem-item b{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--c);color:#fff;white-space:nowrap}
.rem-note{background:var(--yellow);color:var(--note-ink);font:700 18px/1.1 Caveat,cursive;padding:6px 10px;border-radius:6px 6px 12px 12px;transform:rotate(-1deg);margin:5px 0;cursor:pointer;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 18px;font-weight:600;z-index:30;max-width:calc(100vw - 32px);text-align:center;transition:.35s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

/* minimal: white board, pastel pink accent */
:root{--page:#fff;--ink:#3d3540;--grey:#fff;--teal:#fff;--pink:#fdeef3;--purple:#fff;--yellow:#fff3c4;--note-ink:#5a4a2a;--cell-hover:#fff3f7;--today:#f58bb0;--accent:#f7a8c4;--accent-d:#d9709a;--line:#f1e2e9;--bar:#f4c6d6;--class:#8fb4f0}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--page:#1b181c;--ink:#f0e6ec;--grey:#1b181c;--teal:#1b181c;--pink:#2b2127;--purple:#1b181c;--yellow:#4a4130;--note-ink:#f3e7c4;--cell-hover:#2d2229;--today:#f58bb0;--accent:#f7a8c4;--accent-d:#f7a8c4;--line:#3a2e36;--bar:#6b4a5a}}
:root[data-theme='dark']{--page:#1b181c;--ink:#f0e6ec;--grey:#1b181c;--teal:#1b181c;--pink:#2b2127;--purple:#1b181c;--yellow:#4a4130;--note-ink:#f3e7c4;--cell-hover:#2d2229;--today:#f58bb0;--accent:#f7a8c4;--accent-d:#f7a8c4;--line:#3a2e36;--bar:#6b4a5a}
.Class{--c:#8fb4f0}.Extra{--c:#8fd6c2}.Exam{--c:#f28b95}.Friends{--c:#f7a8c4}.Family{--c:#f6c58b}
body{background:color-mix(in srgb,var(--accent) 9%,var(--page))}
.app{border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 40px rgba(217,112,154,.14)}
.board{border-right:1px solid var(--line)}
.month{color:var(--accent-d);-webkit-text-stroke:0;font-weight:500;letter-spacing:.08em;font-size:34px}
.clock b{background:var(--pink);color:var(--ink);font-weight:500}
.nav button,.add button,.close{border:1px solid var(--line);background:var(--page);color:var(--ink)}
.nav button:hover,.add button:hover{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.add button{background:var(--accent);border-color:var(--accent);font-weight:500}
.cal{border:1px solid var(--line);border-radius:18px}
.dow{border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-weight:500;font-size:13px;color:var(--accent-d)}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day.dim{opacity:.35}
.day.sel{background:var(--pink);box-shadow:inset 0 0 0 2px var(--accent)}
.day.today .n{background:var(--accent);color:var(--ink)}
.chip{color:var(--ink)}
.legend i{border-radius:50%}
.box{background:var(--pink)}
.slot{background:var(--bar);box-shadow:none;border-radius:12px}
.slot::after{color:#fff}
.paper{background:var(--page);border:1px solid var(--line);border-top:0;box-shadow:0 8px 24px rgba(217,112,154,.16);background-image:none}
.subject{border-bottom:1px solid var(--accent);font-weight:500}
.paper input:not(.subject),.paper select{border:1px solid var(--line);background:var(--page)}
.evs li{border-left-width:3px}
.add{border-top:1px solid var(--line)}
.note{border:1px solid color-mix(in srgb,var(--note-ink) 18%,transparent);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.note textarea::placeholder{color:color-mix(in srgb,var(--note-ink) 55%,transparent)}
.cat [stroke='#141414']{stroke:#7a6370}
.cat [fill='#141414']{fill:#5a4650}
.cat [fill='#ffc27a']{fill:#ffe3c9}
.cat [stroke='#ffc27a']{stroke:#ffe3c9}
.cat g[stroke-width='3']{stroke-width:2px}
.say{border:1px solid var(--line);color:#3d3540}
.rem-fab{border:0;box-shadow:0 8px 20px rgba(217,112,154,.35)}
.badge{background:var(--page);color:var(--ink);border:1px solid var(--accent)}
.rem-panel{background:var(--page);border:1px solid var(--line);box-shadow:0 12px 36px rgba(217,112,154,.22)}
.rem-item{border-left-width:3px;background:color-mix(in srgb,var(--c) 16%,var(--page))}
.pill{color:#3d3540}
.toast{background:var(--accent);color:#3d3540;border:0;box-shadow:0 8px 24px rgba(217,112,154,.3);font-weight:500}
@media (max-width:820px){.board{border-right:0;border-bottom:1px solid var(--line)}}

/* voxel pass: blocky, extruded, pixel */
:root{--edge:#cf7fa1;--hi:rgba(255,255,255,.65);--lo:rgba(0,0,0,.1);--f1:#ffe9f1;--f2:#fff6fa}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--edge:#0b080b;--hi:rgba(255,255,255,.12);--lo:rgba(0,0,0,.35);--f1:#241b22;--f2:#1f171d}}
:root[data-theme='dark']{--edge:#0b080b;--hi:rgba(255,255,255,.12);--lo:rgba(0,0,0,.35);--f1:#241b22;--f2:#1f171d}
:root{--bevel:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo);
--ext-s:1px 1px 0 var(--edge),2px 2px 0 var(--edge),3px 3px 0 var(--edge),4px 4px 0 var(--edge);
--ext-m:1px 1px 0 var(--edge),2px 2px 0 var(--edge),3px 3px 0 var(--edge),4px 4px 0 var(--edge),5px 5px 0 var(--edge),6px 6px 0 var(--edge);
--ext-l:1px 1px 0 var(--edge),2px 2px 0 var(--edge),3px 3px 0 var(--edge),4px 4px 0 var(--edge),5px 5px 0 var(--edge),6px 6px 0 var(--edge),7px 7px 0 var(--edge),8px 8px 0 var(--edge),9px 9px 0 var(--edge),10px 10px 0 var(--edge),18px 24px 30px rgba(150,60,100,.28)}
body{font:19px/1.15 VT323,'Courier New',monospace;background:conic-gradient(var(--f1) 25%,var(--f2) 0 50%,var(--f1) 0 75%,var(--f2) 0) 0 0/64px 64px;padding:28px 28px 40px}
.app{border:4px solid var(--edge);border-radius:0;box-shadow:var(--ext-l);transform:perspective(1800px) rotateX(5deg) rotateY(-5deg);transform-origin:50% 0;transition:transform .5s}
.app:hover{transform:perspective(1800px) rotateX(1deg) rotateY(-1deg)}
.board{border-right:4px solid var(--edge)}
.month,.hint b,.subject,.rem-panel header,.rem-day h3,.say,.nav button,.add button{font-family:Silkscreen,VT323,monospace;font-weight:400}
.month{font-size:30px;color:var(--accent-d);text-shadow:1px 1px 0 var(--page),2px 2px 0 var(--edge),3px 3px 0 var(--edge),4px 4px 0 var(--edge)}
.clock{font-size:21px}
.clock b{border-radius:0;box-shadow:2px 2px 0 var(--edge)}
.nav button,.add button,.close{border:0;border-radius:0;background:var(--page);font-size:12px;box-shadow:var(--ext-s),var(--bevel)}
.nav button:hover,.add button:hover{background:var(--accent);transform:translate(-1px,-1px)}

/* password lock */
body.locked{overflow:hidden}
body.locked .app,body.locked .rem-fab,body.locked .rem-panel,body.locked .toast{visibility:hidden}
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:conic-gradient(var(--f1) 25%,var(--f2) 0 50%,var(--f1) 0 75%,var(--f2) 0) 0 0/64px 64px;overflow:auto}
.lock-card{width:min(360px,100%);background:var(--page);color:var(--ink);border:4px solid var(--edge);box-shadow:var(--ext-l);padding:24px 22px;display:flex;flex-direction:column;gap:10px;text-align:center}
.lock-icon{font-size:44px;line-height:1;animation:bobfab 3s ease-in-out infinite}
.lock-card h2{margin:0;font:400 20px Silkscreen,VT323,monospace;color:var(--accent-d)}

.lock-card input{font:inherit;font-size:20px;padding:8px 10px;border:2px solid var(--edge);border-radius:0;background:var(--page);color:var(--ink);text-align:center;min-width:0}
.lock-err{min-height:1.2em;color:#d6455d;font-size:18px}
.lock-card button[type=submit]{font:400 13px Silkscreen,VT323,monospace;background:var(--accent);color:var(--ink);border:0;padding:12px;cursor:pointer;box-shadow:var(--ext-s),var(--bevel)}
.lock-card button[type=submit]:active{transform:translate(3px,3px);box-shadow:var(--bevel)}
.lock-link{all:unset;cursor:pointer;font-size:17px;text-decoration:underline;opacity:.8}
.lock-link:focus-visible{outline:2px solid var(--accent-d)}
.lock-card.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* tamagotchi game */
body.locked .game{display:none}

.game{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px;background:rgba(60,30,50,.5);overflow:auto}

#gClose{border:0;background:#fff;color:#3d3540;width:34px;height:34px;font-size:22px;cursor:pointer;box-shadow:var(--ext-s),var(--bevel)}
#gClose:active,.acts button:active{transform:translate(3px,3px);box-shadow:var(--bevel)}

.xp i{display:block;height:100%;width:0;background:#f58bb0;transition:width .4s}
.screen{border:4px solid var(--edge);background:#fdeef3}
.room{position:relative;height:230px;overflow:hidden;background:linear-gradient(#fdeef3 0 62%,transparent 62%),conic-gradient(#e7c9a6 25%,#dcb892 0 50%,#e7c9a6 0 75%,#dcb892 0) 0 0/40px 40px}
.win{position:absolute;left:14px;top:14px;width:54px;height:54px;background:#bfe6ff;border:4px solid #fff;box-shadow:0 0 0 2px var(--edge)}
.bowl{position:absolute;left:8%;bottom:10%;width:46px;height:16px;background:#ff8fb3;border:3px solid var(--edge)}

.room.night::after{content:'';position:absolute;inset:0;background:rgba(40,30,80,.5);pointer-events:none}

.room.night .zzz{display:block}
.pet{position:absolute;left:50%;bottom:7%;width:200px;margin-left:-100px;transform:scale(var(--sc,1));transform-origin:50% 100%;cursor:pointer}
.pet svg{display:block;width:100%;overflow:visible;transform-origin:50% 100%;filter:drop-shadow(2px 0 0 #5a4650) drop-shadow(-2px 0 0 #5a4650) drop-shadow(0 2px 0 #5a4650) drop-shadow(0 -2px 0 #5a4650);animation:breath 3.2s ease-in-out infinite}
.pet .tail{transform-box:fill-box;transform-origin:0 100%;animation:tail 1.6s ease-in-out infinite alternate}

.pet.sad .m-smile,.pet.sick .m-smile{display:none}

.pet.eating .m-open{display:block;animation:chew .3s infinite alternate}

.pet.playing svg{animation:jump .45s ease-in-out infinite}
.pet.dirty .dirt,.pet.sick .sweat{display:block}
.pet.happy::after,.pet.purring::after{content:'♥';position:absolute;top:-8px;right:14%;color:#f58bb0;font-size:22px;animation:float 2s ease-in-out infinite}

.pod .lock-link{color:#3d3540;text-align:center;font-size:16px}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-90px);opacity:0}}
@keyframes jump{40%{transform:translateY(-22px)}}

<script>
const $ = s => document.querySelector(s);
let locked = true;
const pad = n => String(n).padStart(2, '0');
const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st = e => e.start ?? e.time ?? '';
const KINDS = { Class: 'Class', Extra: 'Extra class', Exam: 'Exam', Friends: 'Friends', Family: 'Family' };
const kd = e => KINDS[e.kind] ? e.kind : 'Friends';
const opt = (k, v) => `<option value="${k}"${k === v ? ' selected' : ''}>${KINDS[k]}</option>`;
const kindOpts = v => ['Class', 'Extra', 'Exam'].map(k => opt(k, v)).join('') + `<optgroup label="Others">${opt('Friends', v)}${opt('Family', v)}</optgroup>`;
const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

let data = { events: {}, notes: {}, subjects: {} };
try { const s = JSON.parse(localStorage.getItem('timetable-v1')); if (s && s.events) data = s; } catch (e) {}
const save = () => { try { localStorage.setItem('timetable-v1', JSON.stringify(data)); } catch (e) {} renderRem(); };

const now = new Date();
let view = { y: now.getFullYear(), m: now.getMonth() };
let sel = null, lastDay = key(now.getFullYear(), now.getMonth(), now.getDate());

/* clock */
function tick() {
  const d = new Date();
  $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $('#date').textContent = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const k = key(d.getFullYear(), d.getMonth(), d.getDate());
  if (k !== lastDay) { lastDay = k; renderCal(); renderRem(); }
}
setInterval(tick, 1000); tick();

/* calendar */
function renderCal() {
  const { y, m } = view;
  const cal = $('#cal'), tag = y + '-' + m;
  if (cal.dataset.shown !== tag) { cal.dataset.shown = tag; cal.classList.remove('flip'); void cal.offsetWidth; cal.classList.add('flip'); }
  $('#month').textContent = MONTHS[m] + (y !== new Date().getFullYear() ? ' ' + y : '');
  const first = (new Date(y, m, 1).getDay() + 6) % 7; // Monday first
  const total = Math.ceil((first + new Date(y, m + 1, 0).getDate()) / 7) * 7;
  let h = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="dow" role="columnheader">${d}</div>`).join('');
  for (let i = 0; i < total; i++) {
    const dt = new Date(y, m, 1 - first + i);
    const k = key(dt.getFullYear(), dt.getMonth(), dt.getDate());
    const evs = (data.events[k] || []).slice().sort((a, b) => st(a).localeCompare(st(b)));
    const cls = ['day', dt.getMonth() !== m ? 'dim' : '', k === lastDay ? 'today' : '', k === sel ? 'sel' : '', evs.length ? 'has' : ''].join(' ');
    h += `<button class="${cls}" data-k="${k}" role="gridcell" aria-label="${dt.toDateString()}"><span class="n">${dt.getDate()}</span>` +
      evs.slice(0, 2).map(e => `<span class="chip ${kd(e)}">${esc(st(e))}${e.end ? '–' + esc(e.end) : ''} ${esc(e.title)}</span>`).join('') +
      (evs.length > 2 ? `<span class="more">+${evs.length - 2} more</span>` : '') + `</button>`;
  }
  $('#cal').innerHTML = h;
}
$('#cal').addEventListener('click', e => { const b = e.target.closest('.day'); if (b) openLetter(b.dataset.k); });
$('#prev').onclick = () => { view = view.m ? { y: view.y, m: view.m - 1 } : { y: view.y - 1, m: 11 }; renderCal(); };
$('#next').onclick = () => { view = view.m < 11 ? { y: view.y, m: view.m + 1 } : { y: view.y + 1, m: 0 }; renderCal(); };
$('#today').onclick = () => { const d = new Date(); view = { y: d.getFullYear(), m: d.getMonth() }; renderCal(); openLetter(key(d.getFullYear(), d.getMonth(), d.getDate()), true); };

/* letter */
const letter = $('#letter');
function openLetter(k, forceOpen) {
  if (sel === k && !forceOpen) return closeLetter();
  const show = () => { sel = k; fill(); catHelp(); if (matchMedia('(max-width:820px)').matches) $('.box').scrollIntoView({ behavior: 'smooth', block: 'start' }); requestAnimationFrame(() => letter.classList.add('out')); $('#hint').style.display = 'none'; renderCal(); };
  if (letter.classList.contains('out')) { letter.classList.remove('out'); setTimeout(show, 420); } else show();
}
function closeLetter() {
  sel = null; letter.classList.remove('out'); $('#hint').style.display = ''; renderCal(); catHelp(); if (matchMedia('(max-width:820px)').matches) $('.board').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function fill() {
  const [y, m, d] = sel.split('-').map(Number);
  const label = new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const evs = (data.events[sel] || []).slice().sort((a, b) => st(a).localeCompare(st(b)));
  data.events[sel] = evs;
  letter.innerHTML = `
  <div class="paper">
    <button class="close" aria-label="Close letter">&times;</button>
    <input class="subject" data-f="subject" value="${esc(data.subjects[sel] ?? 'Dear me ♥')}" aria-label="Letter title">
    <div class="when">${label}</div>
    <ul class="evs">${evs.map((e, i) => `
      <li class="${kd(e)}" data-i="${i}">
        <input type="time" data-f="start" value="${esc(st(e))}" aria-label="Start time">
        <span>–</span>
        <input type="time" data-f="end" value="${esc(e.end || '')}" aria-label="End time">
        <input class="t" data-f="title" value="${esc(e.title)}" aria-label="Title" placeholder="Title">
        <select data-f="kind" aria-label="Category">${kindOpts(kd(e))}</select>
        <button class="del" aria-label="Delete">&times;</button>
      </li>`).join('')}</ul>
    ${evs.length ? '' : '<p class="empty">Nothing planned. Add a class or event below.</p>'}
    <div class="add">
      <input type="time" id="nt" value="08:00" aria-label="New start time">
      <span>–</span>
      <input type="time" id="ne" value="09:00" aria-label="New end time">
      <input class="ti" id="nti" placeholder="Class or event" aria-label="New title">
      <select id="nk" aria-label="Category">${kindOpts('Class')}</select>
      <button id="addb">Add</button>
    </div>
  </div>
  <div class="string"></div>
  <div class="note"><textarea data-f="note" placeholder="Sticky note for this day…" aria-label="Note">${esc(data.notes[sel] || '')}</textarea></div>`;
}
function addEvent() {
  const title = $('#nti').value.trim();
  if (!title) { $('#nti').focus(); return; }
  (data.events[sel] = data.events[sel] || []).push({ start: $('#nt').value || '00:00', end: $('#ne').value, title, kind: $('#nk').value });
  save(); fill(); renderCal(); burst($('#addb')); $('#nti').focus();
}
letter.addEventListener('click', e => {
  if (e.target.closest('.close')) return closeLetter();
  if (e.target.id === 'addb') return addEvent();
  const del = e.target.closest('.del');
  if (del) { data.events[sel].splice(+del.closest('li').dataset.i, 1); save(); fill(); renderCal(); }
});
letter.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'nti') addEvent(); });
letter.addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return;
  if (f === 'subject') data.subjects[sel] = e.target.value;
  else if (f === 'note') data.notes[sel] = e.target.value;
  else { const i = +e.target.closest('li').dataset.i; data.events[sel][i][f] = e.target.value; if (f === 'kind') e.target.closest('li').className = e.target.value; }
  save(); renderCal();
});
letter.addEventListener('change', e => { if (e.target.dataset.f === 'start') { fill(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sel) closeLetter(); });
function burst(el) {
  if (!el || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('span'), a = Math.PI * 2 * i / 8;
    s.className = 'heart'; s.textContent = i % 3 ? '♥' : '✦';
    s.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;--dx:${Math.cos(a) * 46}px;--dy:${Math.sin(a) * 46 - 20}px`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 800);
  }
}

/* sound */
let muted = !!data.muted, actx, lastChime = 0;
function audio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return !muted; } catch (e) { return false; } }
function tone(f, t0, dur, vol = .16) {
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + t0;
  o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.start(t); o.stop(t + dur + .05);
}
function chime() { if (locked || !audio()) return; lastChime = Date.now(); [988, 1319, 1568, 2093].forEach((f, i) => tone(f, i * .12, .55)); }
function meow() {
  if (!audio()) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = 'triangle'; o.connect(g); g.connect(actx.destination);
  o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(900, t + .15); o.frequency.exponentialRampToValueAtTime(480, t + .4);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + .42);
  o.start(t); o.stop(t + .45);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 5000);
}

/* cat */
function catHelp() {
  const c = $('#cat'); c.classList.remove('help'); void c.offsetWidth; c.classList.add('help'); meow();
  clearTimeout(catHelp.t); catHelp.t = setTimeout(() => c.classList.remove('help'), 1500);
}
$('#cat').onclick = openGame; $('#cat').title = 'Play with me!';

/* reminders: today + next 3 days */
function upcoming() {
  const out = [], t = new Date();
  for (let i = 0; i < 4; i++) {
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i), k = key(d.getFullYear(), d.getMonth(), d.getDate());
    const evs = (data.events[k] || []).slice().sort((a, b) => st(a).localeCompare(st(b)));
    const note = (data.notes[k] || '').trim();
    if (evs.length || note) out.push({ i, d, k, evs, note });
  }
  return out;
}
const count = () => upcoming().reduce((n, x) => n + x.evs.length + (x.note ? 1 : 0), 0);
function renderRem() {
  const days = upcoming(), n = count();
  $('#badge').textContent = n; $('#badge').hidden = !n;
  $('#remFab').classList.toggle('ring', n > 0);
  $('#mute').textContent = muted ? '🔕' : '🔔';
  $('#remList').innerHTML = days.length ? days.map(x => `<div class='rem-day'><h3>${x.i === 0 ? 'Today' : x.i === 1 ? 'Tomorrow' : x.d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' })}</h3>` +
    x.evs.map(e => `<div class='rem-item ${kd(e)}' data-k='${x.k}'><b>${esc(st(e))}${e.end ? '–' + esc(e.end) : ''}</b><span>${esc(e.title)}</span><span class='pill'>${KINDS[kd(e)]}</span></div>`).join('') +
    (x.note ? `<div class='rem-note' data-k='${x.k}'>${esc(x.note)}</div>` : '') + '</div>').join('')
    : `<p class='empty'>All clear! Nothing planned for the next 3 days ♥</p>`;
}
$('#remFab').onclick = () => { const p = $('#remPanel'); p.hidden = !p.hidden; if (!p.hidden && count() && Date.now() - lastChime > 1500) chime(); };
$('#remClose').onclick = () => { $('#remPanel').hidden = true; };
$('#mute').onclick = () => { muted = !muted; data.muted = muted; save(); if (!muted) chime(); };
$('#remList').addEventListener('click', e => {
  const it = e.target.closest('[data-k]'); if (!it) return;
  const k = it.dataset.k, [y, m] = k.split('-').map(Number);
  view = { y, m: m - 1 }; renderCal(); openLetter(k, true); $('#remPanel').hidden = true;
});

/* greet on first tap (browsers block sound before that) and warn when an event is near */
let greeted = false;
function greet() {
  if (locked || greeted) return; greeted = true;
  const n = count();
  if (n) { chime(); toast(`💌 ${n} reminder${n > 1 ? 's' : ''} for the next 3 days. Tap the letter!`); }
}
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, greet, { once: true }));
const alerted = new Set();
function checkSoon() {
  if (locked) return;
  const d = new Date(), k = key(d.getFullYear(), d.getMonth(), d.getDate()), mins = d.getHours() * 60 + d.getMinutes();
  (data.events[k] || []).forEach((e, i) => {
    const s = st(e); if (!s) return;
    const [h, m] = s.split(':').map(Number), diff = h * 60 + m - mins, id = k + i + s;
    if (diff >= 0 && diff <= 10 && !alerted.has(id)) { alerted.add(id); chime(); toast(`⏰ ${e.title || KINDS[kd(e)]} starts ${diff ? 'in ' + diff + ' min' : 'now'} (${s})`); }
  });
}
setInterval(checkSoon, 20000); checkSoon();

$('#cat svg').outerHTML = `<svg viewBox='0 0 110 90' aria-hidden='true'>
<g class='tail' fill='#ffd2a8'><rect x='85' y='70' width='10' height='5'/><rect x='90' y='55' width='5' height='20'/><rect x='90' y='50' width='10' height='5' fill='#ff9fc0'/></g>
<rect x='25' y='55' width='50' height='25' fill='#ffd2a8'/><rect x='25' y='75' width='50' height='5' fill='#f0b684'/>
<g class='head'>
<rect x='20' y='5' width='10' height='10' fill='#ffd2a8'/><rect x='70' y='5' width='10' height='10' fill='#ffd2a8'/>
<rect x='25' y='10' width='5' height='5' fill='#ff9fc0'/><rect x='70' y='10' width='5' height='5' fill='#ff9fc0'/>
<rect x='20' y='15' width='60' height='40' fill='#ffd2a8'/><rect x='20' y='15' width='60' height='5' fill='#ffe6cf'/><rect x='75' y='20' width='5' height='35' fill='#f0b684'/>
<rect x='35' y='20' width='5' height='5' fill='#f0a867'/><rect x='45' y='20' width='5' height='10' fill='#f0a867'/><rect x='55' y='20' width='5' height='5' fill='#f0a867'/>
<rect class='eye' x='35' y='32' width='5' height='10' fill='#4a3640'/><rect class='eye' x='60' y='32' width='5' height='10' fill='#4a3640'/>
<rect x='28' y='43' width='7' height='5' fill='#ffb3cd'/><rect x='65' y='43' width='7' height='5' fill='#ffb3cd'/>
<rect x='45' y='43' width='10' height='5' fill='#ff6fa5'/><rect x='40' y='48' width='5' height='2' fill='#4a3640'/><rect x='55' y='48' width='5' height='2' fill='#4a3640'/>
</g>
<g class='paws' fill='#fff4e6'><rect x='30' y='78' width='15' height='8'/><rect x='55' y='78' width='15' height='8'/></g></svg>`;
/* password lock (a privacy screen: the password is kept only as a salted hash on this device) */
const PW_KEY = 'timetable-pw';
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function hashPw(pw, salt) {
  try { return hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw))); }
  catch (e) { let h = 5381; for (const c of salt + ':' + pw) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return 'x' + h; }
}
let stored = null; try { stored = JSON.parse(localStorage.getItem(PW_KEY)); } catch (e) {}
function showLock() {
  const setup = !stored;
  $('#lockTitle').textContent = setup ? 'Create a password' : 'Welcome back ♥';
  $('#lockMsg').textContent = setup ? 'Choose a password (4+ characters). You will enter it every time you open the timetable.' : 'Enter your password to open your timetable.';
  $('#pw2').hidden = !setup; $('#forgot').hidden = setup;
  $('#lockBtn').textContent = setup ? 'Set password' : 'Unlock';
  $('#pw1').autocomplete = setup ? 'new-password' : 'current-password';
  $('#pw1').value = $('#pw2').value = ''; $('#lockErr').textContent = '';
  $('#lock').hidden = false; document.body.classList.add('locked'); locked = true; closeGame();
  setTimeout(() => $('#pw1').focus(), 50);
}
function unlock() {
  $('#lock').hidden = true; document.body.classList.remove('locked'); locked = false;
  greeted = false; greet();
}
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw1').value;
  const err = m => { $('#lockErr').textContent = m; const c = $('#lockForm'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); };
  if (!stored) {
    if (pw.length < 4) return err('Use at least 4 characters.');
    if (pw !== $('#pw2').value) return err('Passwords do not match.');
    const salt = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
    stored = { salt, hash: await hashPw(pw, salt) };
    try { localStorage.setItem(PW_KEY, JSON.stringify(stored)); } catch (x) {}
    return unlock();
  }
  if (await hashPw(pw, stored.salt) !== stored.hash) { $('#pw1').select(); return err('Wrong password, try again.'); }
  unlock();
});
let armed = false;
$('#forgot').onclick = () => {
  const b = $('#forgot');
  if (!armed) { armed = true; b.textContent = 'Tap again: this erases all saved data'; setTimeout(() => { armed = false; b.textContent = 'Forgot password?'; }, 4000); return; }
  armed = false; b.textContent = 'Forgot password?';
  try { localStorage.removeItem(PW_KEY); localStorage.removeItem('timetable-v1'); } catch (x) {}
  data = { events: {}, notes: {}, subjects: {} }; stored = null; renderCal(); renderRem(); showLock();
};
$('#lockNow').onclick = () => {
  $('#remPanel').hidden = true; sel = null; letter.classList.remove('out'); $('#hint').style.display = ''; renderCal(); showLock();
};
/* ===== tamagotchi: British Shorthair kitten ===== */
const PET_KEY = 'timetable-pet-v1';
const defPet = () => ({ name: 'Mochi', hunger: 80, happy: 80, clean: 80, energy: 80, health: 100, xp: 0, born: Date.now(), last: Date.now(), sleeping: false });
let pet, act = '', actT, gameT, armedReset = false;
try { pet = Object.assign(defPet(), JSON.parse(localStorage.getItem(PET_KEY))); } catch (e) { pet = defPet(); }
const savePet = () => { try { localStorage.setItem(PET_KEY, JSON.stringify(pet)); } catch (e) {} };
const clamp = v => Math.max(0, Math.min(100, v));
const nm = () => (pet.name || '').trim() || 'Mochi';
const lvl = () => 1 + Math.floor(pet.xp / 40);
const STATS = [['hunger', 'bHunger'], ['happy', 'bHappy'], ['clean', 'bClean'], ['energy', 'bEnergy'], ['health', 'bHealth']];
function say(m) { const s = $('#petSay'); s.textContent = m; s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); }
function decay(mins) {
  const m = Math.max(0, Math.min(mins, 120));
  pet.hunger = clamp(pet.hunger - m * (pet.sleeping ? .3 : .9));
  pet.happy = clamp(pet.happy - m * .6);
  pet.clean = clamp(pet.clean - m * .4);
  pet.energy = clamp(pet.energy + m * (pet.sleeping ? 4 : -.4));
  const low = [pet.hunger, pet.happy, pet.clean, pet.energy].some(v => v < 20);
  pet.health = clamp(pet.health + m * (low ? -.5 : .3));
  if (pet.sleeping && pet.energy >= 100) { pet.sleeping = false; say('Good morning! ☀️'); }
}
function mood() {
  if (pet.sleeping) return 'sleep';
  if (pet.health < 40) return 'sick';
  if (Math.min(pet.hunger, pet.happy, pet.clean, pet.energy) < 25) return 'sad';
  return pet.happy > 75 && pet.hunger > 50 ? 'happy' : 'ok';
}
function renderGame() {
  const box = $('#petBox'), L = lvl();
  box.className = 'pet ' + mood() + (act ? ' ' + act : '') + (pet.clean < 35 ? ' dirty' : '');
  box.style.setProperty('--sc', L < 3 ? .8 : L < 6 ? .9 : 1);
  $('#room').classList.toggle('night', pet.sleeping);
  $('#room').classList.toggle('playing', act === 'playing');
  STATS.forEach(([k, id]) => { const i = $('#' + id); i.style.width = pet[k] + '%'; i.parentElement.classList.toggle('low', pet[k] < 25); });
  $('#petLvl').textContent = 'Lv' + L + (L < 3 ? ' Kitten' : L < 6 ? ' Young' : ' Adult');
  $('#petAge').textContent = 'Day ' + (Math.floor((Date.now() - pet.born) / 864e5) + 1);
  $('#xpFill').style.width = (pet.xp % 40) / 40 * 100 + '%';
  $('#gSleep').innerHTML = pet.sleeping ? '<span>☀️</span>Wake' : '<span>🌙</span>Sleep';
}
function flo(e) {
  const r = $('#room');
  for (let i = 0; i < 4; i++) {
    const s = document.createElement('span'); s.className = 'fl'; s.textContent = e;
    s.style.left = 30 + Math.random() * 40 + '%'; s.style.animationDelay = i * .18 + 's';
    r.appendChild(s); setTimeout(() => s.remove(), 2000);
  }
}
function sfx(t) {
  if (!audio()) return;
  if (t === 'eat') [0, 1, 2].forEach(i => tone(520 + i * 40, i * .12, .08, .1));
  else if (t === 'play') [660, 880, 740, 990].forEach((f, i) => tone(f, i * .1, .12, .1));
  else if (t === 'groom') [1200, 1500, 1300].forEach((f, i) => tone(f, i * .08, .07, .07));
  else if (t === 'vet') [523, 659, 784].forEach((f, i) => tone(f, i * .12, .25, .1));
  else if (t === 'sleep') [660, 520, 400].forEach((f, i) => tone(f, i * .2, .3, .08));
  else meow();
}
function doAct(a) {
  if (pet.sleeping && a !== 'sleep') return say('Shh... ' + nm() + ' is sleeping 💤');
  let r, n = 0;
  if (a === 'feed') { if (pet.hunger > 95) return say('Too full for now 🍽️'); pet.hunger += 28; pet.happy += 3; pet.clean -= 4; n = 3; r = ['eating', 'Yum yum! 🐟', '🐟', 'eat']; }
  else if (a === 'treat') { pet.hunger += 8; pet.happy += 12; pet.clean -= 3; n = 2; r = ['eating', 'Crunchy treat! ♥', '🍪', 'eat']; }
  else if (a === 'play') { if (pet.energy < 15) return say(nm() + ' is too sleepy to play 😴'); pet.happy += 22; pet.energy -= 14; pet.hunger -= 8; pet.clean -= 5; n = 6; r = ['playing', 'Wheee! Catch it! 🧧', '🧧', 'play']; }
  else if (a === 'groom') { pet.clean += 35; pet.happy += 6; n = 4; r = ['grooming', 'So soft and fluffy! ✨', '🪥', 'groom']; }
  else if (a === 'pet') { pet.happy += 9; n = 1; r = ['purring', 'Purr purr... ♥', '♥', 'purr']; }
  else if (a === 'vet') { if (pet.health > 85) return say(nm() + ' is healthy as can be! 💪'); pet.health += 35; pet.happy -= 6; n = 2; r = ['vet', 'All better! 💊', '💊', 'vet']; }
  else if (a === 'sleep') {
    pet.sleeping = !pet.sleeping; say(pet.sleeping ? 'Zzz... sweet dreams 🌙' : 'Good morning! ☀️'); sfx('sleep');
    act = ''; savePet(); return renderGame();
  }
  STATS.forEach(([k]) => { pet[k] = clamp(pet[k]); });
  const L0 = lvl(); pet.xp += n;
  if (lvl() > L0) { chime(); toast('⭐ Level up! ' + nm() + ' is now level ' + lvl()); }
  act = r[0]; flo(r[2]); say(r[1]); sfx(r[3]);
  if (act === 'purring' || act === 'grooming' || act === 'playing') burst($('#petBox'));
  clearTimeout(actT); actT = setTimeout(() => { act = ''; renderGame(); }, 2200);
  savePet(); renderGame();
}
function tickGame() { const t = Date.now(); decay((t - pet.last) / 60000); pet.last = t; savePet(); renderGame(); }
function openGame() {
  if (locked) return;
  const t = Date.now(); decay((t - pet.last) / 60000); pet.last = t; savePet();
  $('#game').hidden = false; document.body.classList.add('gaming');
  $('#petName').value = pet.name; act = ''; renderGame();
  const md = mood();
  say(md === 'sleep' ? nm() + ' is napping 💤' : md === 'sick' ? nm() + ' feels sick. Visit the vet 💊' : md === 'sad' ? nm() + ' needs some love 🥺' : md === 'happy' ? nm() + ' missed you! ♥' : 'Hi! Let us hang out 🐾');
  if (md !== 'sleep') meow();
  clearInterval(gameT); gameT = setInterval(tickGame, 5000);
}
function closeGame() {
  if ($('#game').hidden) return;
  $('#game').hidden = true; document.body.classList.remove('gaming'); clearInterval(gameT);
  pet.last = Date.now(); savePet();
}
$('#acts').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) doAct(b.dataset.a); });
$('#petBox').onclick = () => doAct('pet');
$('#gClose').onclick = closeGame;
$('#game').addEventListener('click', e => { if (e.target.id === 'game') closeGame(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#game').hidden) closeGame(); });
$('#petName').addEventListener('input', e => { pet.name = e.target.value.slice(0, 12); savePet(); });
$('#petName').addEventListener('change', e => { if (!pet.name.trim()) { pet.name = 'Mochi'; e.target.value = 'Mochi'; savePet(); } });
$('#gReset').onclick = () => {
  const b = $('#gReset');
  if (!armedReset) { armedReset = true; b.textContent = 'Tap again to adopt a new kitten'; setTimeout(() => { armedReset = false; b.textContent = 'Adopt a new kitten'; }, 4000); return; }
  armedReset = false; b.textContent = 'Adopt a new kitten';
  pet = defPet(); savePet(); act = ''; $('#petName').value = pet.name; renderGame(); say('Meet your new kitten! 🐱');
};
/* mailbox cat becomes grey and white too */
{ const s = $('#cat svg'); s.innerHTML = s.innerHTML.replaceAll('#ffd2a8', '#a4adb8').replaceAll('#f0b684', '#8892a0').replaceAll('#ffe6cf', '#c3ccd6').replaceAll('#f0a867', '#8892a0').replaceAll('#fff4e6', '#ffffff'); }
showLock();
renderCal();
renderRem();
</script>
